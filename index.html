<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f0e14"><style>html,body{margin:0}</style></head><body>
<title>HusHelt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@500;700&display=swap">
<style>
/* Layout: telefonramme, profilkort øverst på Hjem, fire faner nederst, overlegg for belønninger. Mørkt, rolig, med lilla-rosa aksent. */
:root{
  --bg:#0f0e14; --card:#1a1822; --card2:#252232; --fg:#f3f1fa; --muted:#9b97b0;
  --xp:#b39cff; --xp-d:#7b5cf0; --money:#5eead4; --flame:#ffa26b; --gold:#f5c76b; --bad:#ff7a90; --line:#2e2a3d;
  --display:'Bricolage Grotesque','Helvetica Neue',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f7f5fb; --card:#ffffff; --card2:#efecf7; --fg:#1a1727; --muted:#6a6580;
  --xp:#6a47e0; --xp-d:#6a47e0; --money:#0f8f7e; --flame:#c75d12; --gold:#9a6a00; --bad:#c42b49; --line:#e1dcef; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f7f5fb; --card:#ffffff; --card2:#efecf7; --fg:#1a1727; --muted:#6a6580;
  --xp:#6a47e0; --xp-d:#6a47e0; --money:#0f8f7e; --flame:#c75d12; --gold:#9a6a00; --bad:#c42b49; --line:#e1dcef; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:500;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--xp);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo span{color:var(--xp)}
.modebtn{border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:8px 16px 20px;min-width:0}
nav{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 10px;background:var(--bg);border-top:1px solid var(--line)}
nav button{padding:6px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);position:relative}
nav button.on{color:var(--fg)}
nav button.on svg{color:var(--xp)}
nav .badge{position:absolute;top:0;left:calc(50% + 8px)}
h2{font-family:var(--display);font-size:13px;margin:24px 0 10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:16px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.profile{border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden}
.profile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% -10%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.profile>*{position:relative;z-index:1}
.mono{width:96px;height:96px;border-radius:32%;padding:3px;flex:none}
.mono .in{width:100%;height:100%;border-radius:30%;background:rgba(255,255,255,.2);overflow:hidden}
.mono svg{width:100%;height:100%;display:block}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw2{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--bg)}
.sw2.on{border-color:var(--fg)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset{background:var(--card);border-radius:18px;padding:8px 6px 10px;text-align:center;font-size:12px;color:var(--muted)}
.preset svg{width:100%;max-width:84px;display:block;margin:0 auto 4px;border-radius:26%;background:var(--card2)}
.preset.on{outline:2px solid var(--xp);color:var(--fg)}
.promo{display:flex;gap:12px;align-items:center;background:var(--card);border:1px dashed var(--xp);border-radius:18px;padding:12px 14px;margin-top:10px}
.f-none{background:rgba(255,255,255,.35)}
.f-gold{background:conic-gradient(#f5c76b,#fff2c4,#c79a2e,#f5c76b)}
.f-holo{background:conic-gradient(#7af,#f7a,#fd7,#7fd,#7af)}
.pname{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.5px}
.pill{display:inline-block;background:rgba(0,0,0,.28);padding:3px 11px;border-radius:999px;font-size:12px;margin-top:6px}
.sticker{position:absolute!important;top:14px;right:16px;font-size:26px;opacity:.95}
.xpbar{height:8px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden;margin-top:18px}
.xpbar i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .8s ease}
.xpnum{font-size:12px;margin-top:6px;display:flex;justify-content:space-between;opacity:.9;font-variant-numeric:tabular-nums}
.bar2{height:6px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:10px}
.bar2 i{display:block;height:100%;background:var(--xp);border-radius:999px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chip{background:var(--card);border-radius:18px;padding:12px}
.chip .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.chip .l svg{width:14px;height:14px}
.chip .v{font-family:var(--display);font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.mom{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.mom .av{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--muted)}
.bubble{background:var(--card);border-radius:4px 16px 16px 16px;padding:10px 14px;flex:1;min-width:0;font-size:14px}
.btn{display:block;width:100%;min-height:50px;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,var(--xp-d),#c05ad6);color:#fff;font-weight:700;font-size:15px;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98)}
.btn.ok{background:var(--money);color:#06231f}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:13px;width:auto;border-radius:12px}
.btn:disabled{opacity:.4}
.hero{background:var(--card);border-radius:22px;padding:18px;border:1px solid var(--line)}
.hero .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--xp);font-weight:700}
.hero .ht{font-family:var(--display);font-size:22px;font-weight:800;margin:6px 0 4px;letter-spacing:-.3px}
.q{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px;margin-bottom:8px}
.q .ico{width:46px;height:46px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--xp)}
.q .t{font-weight:700}
.rw{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.rw .kr{color:var(--money)}.rw .xp{color:var(--xp)}
.st{font-size:12px;color:var(--muted);margin-top:2px}
.q.wait{opacity:.8}
.q.back{outline:1px solid var(--bad)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.seg button{border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chests{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chest{background:var(--card);border-radius:20px;padding:16px 12px;text-align:center}
.chest .tile{width:64px;height:64px;border-radius:18px;margin:0 auto 10px;display:grid;place-items:center;color:#fff}
.chest .tile svg{width:30px;height:30px}
.t-mys{background:linear-gradient(135deg,#6a47e0,#a86bd6)}.t-luck{background:linear-gradient(135deg,#2bb6a0,#4a9fe0)}.t-epic{background:linear-gradient(135deg,#a44bd6,#f06ba0)}.t-leg{background:linear-gradient(135deg,#d9a032,#f5d27a)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{background:var(--card);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;position:relative;font-size:24px}
.item.locked{color:var(--muted)}
.item.on{outline:2px solid var(--xp)}
.item small{position:absolute;bottom:5px;font-size:10px;color:var(--muted)}
.sw{width:30px;height:30px;border-radius:50%;margin-bottom:8px}
.overlay{position:absolute;inset:0;background:rgba(8,7,12,.92);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:20;color:#f3f1fa}
.overlay[hidden]{display:none}
.overlay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ov-big{font-family:var(--display);font-size:48px;font-weight:800;line-height:1;letter-spacing:-1px;background:linear-gradient(135deg,#b39cff,#ff8fb5);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov-sub{font-size:17px;opacity:.85}
.ov-card{background:var(--card);border-radius:22px;padding:18px 28px;min-width:240px}
.ov-card .n{font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.pop{animation:pop .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 12px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--card2);border-radius:8px;min-height:4px;transition:height .8s}
.bars div.today{background:var(--xp)}
.days{display:flex;gap:8px;margin-top:6px}
.days span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:30;text-align:center;font-weight:700;animation:pop .25s both}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;padding:0 4px}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.big-n{font-family:var(--display);font-size:48px;font-weight:800;color:var(--money);letter-spacing:-1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="logo">Hus<span>Helt</span></div>
    <button class="modebtn" id="modebtn"></button>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <div class="overlay" id="ov" hidden><canvas id="cv"></canvas><div id="ovbody" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:14px"></div></div>
</div>

  function pStats(){
    var tot=S.week.reduce(function(a,b){return a+b},0);
    return '<h2>Oversikt</h2><div class="chips"><div class="chip"><div class="l">Uke</div><div class="v">'+tot+'</div></div><div class="chip"><div class="l">Måned</div><div class="v">'+(tot*4+S.approved)+'</div></div><div class="chip"><div class="l">Totalt</div><div class="v">'+(S.approved+62)+'</div></div></div>'+
      '<h2>Aktivitet denne uka</h2><div class="card"><div class="bars">'+S.week.map(function(v,i){return '<div class="'+(i===3?'today':'')+'" style="height:'+Math.max(4,v*22)+'px"></div>'}).join('')+'</div><div class="days">'+['Man','Tir','Ons','Tor','Fre','Lør','Søn'].map(function(d){return '<span>'+d+'</span>'}).join('')+'</div></div>'+
      '<h2>Høydepunkter</h2><div class="card"><div style="margin-bottom:10px">Beste uke: 7 av 7 quests</div><div style="margin-bottom:10px">Favorittoppgave: Tømme oppvaskmaskinen</div><div>Mest utført: Ta ut søppel (24 ganger)</div></div>';
  }
  function render(){
    var v={'home':kidHome,'quests':kidQuests,'loot':kidLoot,'me':kidMe,'p-home':pHome,'p-new':pNew,'p-pay':pPay,'p-stats':pStats}[S.tab];
    var top=main.scrollTop;main.innerHTML=v();main.scrollTop=top;renderNav();
  }

  var cv=$('#cv'),cx=cv.getContext('2d'),parts=[],raf=0;
  function confetti(){
    cv.width=ov.clientWidth;cv.height=ov.clientHeight;parts=[];
    var cols=['#b39cff','#5eead4','#f5c76b','#ff8fb5','#ffffff'];
    for(var i=0;i<90;i++)parts.push({x:cv.width/2,y:cv.height/2.4,vx:(Math.random()-.5)*13,vy:-Math.random()*12-3,r:Math.random()*5+2.5,c:cols[i%5],a:Math.random()*6});
    cancelAnimationFrame(raf);
    (function f(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
      if(parts.some(function(p){return p.y<cv.height+20}))raf=requestAnimationFrame(f)})();
  }
  function showOv(html){ov.hidden=false;ovbody.innerHTML=html;confetti();var b=ov.querySelector('#ovok');if(b){b.onclick=closeOv;b.focus()}}
  function closeOv(){ov.hidden=true;cancelAnimationFrame(raf);render()}
  function addXp(n){var up=0;S.xp+=n;while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;up++}return up}
  function approve(q){
    q.st=q.rep==='Én gang'?'done':'open';
    S.kr+=q.kr;S.approved++;S.weekDone=Math.min(S.weekGoal,S.weekDone+1);S.week[3]++;
    var up=addXp(q.xp),chest=false;
    if(S.approved%3===0){S.chests.push({t:'Mystery Box'});chest=true}
    S.streak=Math.max(S.streak,6);
    if(up){S.coins+=25;if(S.inv.indexOf('moon')<0)S.inv.push('moon')}
    jingle(up?[523,659,784,1047]:[523,659,784]);vib(up?[60,40,120]:30);
    S.mode='kid';S.tab='home';
    showOv('<div class="ov-big pop">'+(up?'Level '+S.lvl:'Godkjent')+'</div><div class="ov-sub">'+(up?'Rolig nå. Du går forbi alle.':pick(OK))+'</div>'+
      '<div class="ov-card pop"><div class="n" style="color:#5eead4">+'+q.kr+' kr</div><div class="n" style="color:#b39cff">+'+q.xp+' XP</div>'+
      (up?'<div class="st" style="margin-top:8px">Nytt klistremerke låst opp: Måne</div>':'')+(chest?'<div class="st" style="margin-top:8px">Ny kiste: Mystery Box</div>':'')+'</div>'+
      '<button class="btn" style="width:240px" id="ovok">Fortsett</button>');
  }
  function openChest(i){
    var c=S.chests.splice(i,1)[0];
    var pool=ITEMS.filter(function(it){return S.inv.indexOf(it.id)<0});
    var r=Math.random(),title,sub;
    if(pool.length&&r<.75){var it=pick(pool);S.inv.push(it.id);title=it.n;sub='Nytt '+({theme:'tema',frame:'ramme',sticker:'klistremerke',acc:'tilbehør',top:'overdel',pet:'kjæledyr'}[it.slot])+'. Ta det på under Meg.'}
    else{S.coins+=30;title='+30 mynter';sub='Til butikken som kommer senere.'}
    jingle([200,300,500,800,1200]);vib([40,30,80]);
    showOv('<div class="ov-sub">'+c.t+'</div><div class="ov-card pop"><div class="n">'+esc(title)+'</div><div class="st" style="margin-top:6px">'+sub+'</div></div><button class="btn" style="width:240px" id="ovok">Fint</button>');
  }
  function spin(){
    S.spinUsed=true;var g=pick([{t:'+15 XP',f:function(){addXp(15)}},{t:'+10 mynter',f:function(){S.coins+=10}},{t:'Streak-skjold',f:function(){}}]);
    g.f();jingle([392,523,659]);
    showOv('<div class="ov-sub">Daglig spin</div><div class="ov-card pop"><div class="n">'+g.t+'</div></div><button class="btn" style="width:240px" id="ovok">Fortsett</button>');
  }

  document.addEventListener('input',function(e){if(e.target.id==='f-name')S.name=e.target.value});
  document.addEventListener('change',function(e){if(e.target.id==='f-name')render()});
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-a],[data-t],[data-cat],#modebtn');if(!el)return;
    if(el.id==='modebtn'){S.mode=S.mode==='kid'?'parent':'kid';S.tab=S.mode==='kid'?'home':'p-home';render();return}
    if(el.dataset.cat){S.cat=el.dataset.cat;render();return}
    if(!el.dataset.a&&el.dataset.t){S.tab=el.dataset.t;render();beep(440,.06);return}
    var a=el.dataset.a,id=+el.dataset.id,q=S.quests.filter(function(x){return x.id===id})[0];
    if(a==='take'){q.st='taken';S.npc=(S.npc+1)%NPC.length;S.npcMsg=null;beep(520,.1,'square');toast('Quest tatt');render()}
    else if(a==='done'){q.st='wait';beep(660,.15);toast('Sendt til mamma for godkjenning');render()}
    else if(a==='approve'){approve(q)}
    else if(a==='reject'){q.st='back';q.msg=pick(BACK);toast('Sendt tilbake med melding');render()}
    else if(a==='del'){S.quests=S.quests.filter(function(x){return x.id!==id});render()}
    else if(a==='create'){
      var t=$('#f-t').value.trim();if(!t){toast('Skriv en tittel først');return}
      S.quests.push({id:S.nid++,t:t,ic:'spark',kr:+$('#f-kr').value||0,xp:+$('#f-xp').value||0,rep:$('#f-r').value,st:'open',cat:'today'});
      S.tab='p-home';toast('Quest opprettet');render()}
    else if(a==='pay'){toast('Utbetalt '+S.kr+' kr');S.kr=0;jingle([784,1047]);render()}
    else if(a==='msg'){S.npcMsg=el.dataset.m;toast('Sendt: '+el.dataset.m)}
    else if(a==='open'){openChest(+el.dataset.i)}
    else if(a==='spin'){spin()}
    else if(a==='equip'){var it=ITEMS.filter(function(x){return x.id===el.dataset.id})[0];S.eq[it.slot]=(S.eq[it.slot]===it.id&&it.slot!=='theme'&&it.slot!=='top')?null:it.id;S.avDone=true;beep(600,.08);render()}
    else if(a==='title'){S.title=el.dataset.t;render()}
    else if(a==='goavatar'){S.tab='me';render()}
    else if(a==='g'){S.av.g=el.dataset.v;S.av.hs=({f:'long',m:'short',n:'bob'})[el.dataset.v];S.avDone=true;render()}
    else if(a==='skin'||a==='hs'||a==='hc'||a==='tc'){S.av[a]=el.dataset.v;S.avDone=true;render()}
    else if(a==='preset'){var p=PRESETS[+el.dataset.i];S.av={g:p.g,skin:p.skin,hs:p.hs,hc:p.hc,tc:p.tc};S.eq.top=p.top;S.avDone=true;beep(600,.08);render()}
  });
  render();
})();
</script>

</body></html>
